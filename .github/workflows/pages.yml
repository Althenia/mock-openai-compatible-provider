name: Publish documentation

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "scripts/**"
      - "src/docs-site.test.ts"
      - "src/static-docs-site.test.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: sh -n site/install.sh && sh scripts/test-install.sh
      - run: bun test src/docs-site.test.ts src/static-docs-site.test.ts
  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build public documentation and installer
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun scripts/build-docs-site.ts --out output/pages --base-path "$PAGES_BASE_PATH"
      - name: Upload public documentation and installer
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
