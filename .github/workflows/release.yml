name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: sh scripts/test-install.sh
      - name: Verify redistribution material
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES
          test -s SOURCE.md
          test -s third-party/sources.sha256
          test "$(bun -p 'require("./package.json").license')" = AGPL-3.0-only
          test -s "docs/releases/v$(bun -p 'require("./package.json").version').md"
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

  build:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:build
      - run: bun run test:release
      - name: Prepare release asset
        run: bash scripts/prepare-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aipass-release
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aipass-release
          path: release
      - name: Verify checksums
        run: |
          cd release
          sha256sum -c checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "docs/releases/$GITHUB_REF_NAME.md" --title "$GITHUB_REF_NAME"
