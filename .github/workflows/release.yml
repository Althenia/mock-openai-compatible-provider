name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: sh scripts/test-install.sh
      - name: Verify redistribution material
        run: |
          test -s LICENSE
          test "$(bun -p 'require("./package.json").license')" = AGPL-3.0-only
          test -s "docs/releases/v$(bun -p 'require("./package.json").version').md"
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

  build:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:build
      - run: bun run test:release
      - name: Prepare release asset
        run: bash scripts/prepare-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aipass-release
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: aipass-release
          path: release
      - name: Verify checksums
        run: |
          cd release
          sha256sum -c checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/aipass-* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" --title "$GITHUB_REF_NAME"
