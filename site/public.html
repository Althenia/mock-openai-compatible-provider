<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AIPass documentation</title>
  <style>
    :root{--ink:#10233f;--blue:#176db6;--slate:#d8e2ee;--paper:#fff;--wash:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration-color:#82b5de;text-underline-offset:.2em}a:hover{color:var(--blue)}a:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:3px}.shell{display:grid;grid-template-columns:16rem minmax(0,1fr);min-height:100vh}aside{padding:2rem 1.25rem;background:var(--ink);color:#e8f2fb}.mark{display:block;margin-bottom:3rem;font:700 1.1rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-decoration:none}nav{display:grid;gap:.45rem;font-size:.9rem}nav a{padding:.45rem .6rem;border-radius:.35rem;text-decoration:none}nav a:hover{background:#ffffff17;color:#fff}main{max-width:1040px;padding:clamp(2rem,5vw,5rem)}.eyebrow{color:var(--blue);font:700 .75rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}h1{max-width:13ch;margin:.8rem 0 1.4rem;font-size:clamp(2.5rem,7vw,5.7rem);line-height:.94;letter-spacing:-.065em}.lede{max-width:61ch;color:#405572;font-size:1.1rem}.rule{height:1px;margin:3rem 0;background:var(--slate)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.panel{padding:1.25rem;background:var(--paper);border:1px solid var(--slate);border-radius:.65rem;box-shadow:0 14px 32px #10233f0a}.panel h2{margin:0;font-size:1.35rem;letter-spacing:-.025em}.panel p{margin:.45rem 0 0;color:#526784}.links{display:grid;gap:.5rem;margin-top:1rem}.links a{display:flex;justify-content:space-between;gap:1rem;padding:.65rem .75rem;border:1px solid var(--slate);border-radius:.4rem;text-decoration:none}.links a::after{content:"↗";color:var(--blue)}@media(max-width:700px){.shell{display:block}aside{padding:1.25rem}.mark{margin-bottom:1.25rem}nav{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:2.5rem 1.25rem}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="shell"><aside><a class="mark" href="{{ROOT}}">AIPASS / DOCS</a><nav aria-label="Documentation">{{NAV}}</nav></aside><main id="top">{{CONTENT}}</main></div></body>
</html>
